<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>점 스타일 시안</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #05070d; color: #EEF3FF; font-family: Pretendard, system-ui, sans-serif; padding: 28px 32px 60px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .sub { color: rgba(238,243,255,.6); font-size: 13px; margin-bottom: 22px; line-height: 1.6; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
  .card { border: 2px solid rgba(238,243,255,.1); border-radius: 12px; overflow: hidden; cursor: pointer; transition: border-color .2s; }
  .card.selected { border-color: #FFB547; }
  .shot { position: relative; aspect-ratio: 16 / 9; background: radial-gradient(120% 80% at 70% 0%, #13203A, #070B16 60%); }
  .shot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .shot::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 95% at 72% 40%, rgba(7,11,22,0) 38%, rgba(7,11,22,.8) 100%); }
  .copy { position: absolute; left: 6%; top: 50%; transform: translateY(-50%); z-index: 2; max-width: 44%; }
  .copy .pre { font: 500 9px 'IBM Plex Mono', monospace; letter-spacing: .3em; color: #FFB547; }
  .copy h2 { font: 700 clamp(14px, 2vw, 26px) 'Space Grotesk', Pretendard, sans-serif; letter-spacing: -.03em; margin: 8px 0; }
  .copy p { font-size: clamp(9px, .85vw, 12px); color: rgba(238,243,255,.72); line-height: 1.6; }
  .meta { padding: 12px 16px; display: flex; gap: 12px; align-items: baseline; background: #0a0e18; }
  .meta b { font: 500 12px 'IBM Plex Mono', monospace; color: #FFB547; }
  .meta h3 { font-size: 14px; font-weight: 600; }
  .meta span { font-size: 12px; color: rgba(238,243,255,.55); margin-left: auto; text-align: right; }
  .zoom { font: 500 11px 'IBM Plex Mono', monospace; color: rgba(238,243,255,.5); background: none; border: 1px solid rgba(238,243,255,.15); border-radius: 6px; padding: 4px 8px; cursor: pointer; margin-left: 8px; }
  #big { position: fixed; inset: 0; z-index: 10; display: none; background: radial-gradient(120% 80% at 70% 0%, #13203A, #070B16 60%); cursor: zoom-out; }
  #big.on { display: block; }
  #big canvas { width: 100%; height: 100%; }
  #big::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 95% at 72% 40%, rgba(7,11,22,0) 38%, rgba(7,11,22,.8) 100%); }
  #big .copy { left: max(7vw, calc((100vw - 1080px) / 2)); max-width: 460px; }
  #big .copy .pre { font-size: 11px; } #big .copy h2 { font-size: 44px; } #big .copy p { font-size: 15px; }
  #big .lbl { position: absolute; right: 20px; top: 16px; z-index: 3; font: 500 12px 'IBM Plex Mono', monospace; color: rgba(238,243,255,.5); }
</style></head><body>
<h1>① PROJECT 화면의 배경 점 — 4가지 스타일 </h1>
<p class="sub">실제 지형 데이터(점 약 14,000개)를 사이트와 같은 카메라로 그렸습니다. 카드를 누르면 선택, <b>크게 보기</b>를 누르면 실제 화면 크기로 봅니다(아무 곳이나 누르면 닫힘).<br>배경색은 지금 사이트 그대로이고, 배경색은 다음 화면에서 따로 봅니다.</p>

<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  :root { --bg:#070B16; --ink:#EEF3FF; --muted:#9aa7c7; --amber:#FFB547; --blue:#8FB8FF; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,sans-serif; }
  .bar { padding:16px 28px; border-bottom:1px solid #13203A; color:var(--muted); font-size:14px; line-height:1.6; }
  .bar b { color:var(--ink); }
  .bar button { background:#13203A; color:var(--ink); border:1px solid #2a3a5c; border-radius:6px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer; margin-left:8px; }
  main { padding:24px 28px 60px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(560px,1fr)); gap:20px; }
  .card { background:#0B1222; border:1.5px solid #13203A; border-radius:14px; padding:18px 20px 16px; cursor:pointer; transition:border-color .2s; position:relative; }
  .card:hover { border-color:#2a3a5c; }
  .card.sel { border-color:var(--amber); }
  .card.sel::after { content:"✓ 선택"; position:absolute; top:14px; right:16px; color:var(--amber); font-size:13px; font-weight:700; }
  .tag { font-family:"IBM Plex Mono",ui-monospace,monospace; color:var(--amber); font-size:12px; letter-spacing:.14em; }
  h3 { margin:4px 0 4px; font-size:19px; }
  .card p { margin:0 0 10px; color:var(--muted); font-size:14px; line-height:1.5; }
  .real { font-size:11px; font-family:"IBM Plex Mono",monospace; padding:2px 6px; border-radius:4px; margin-left:6px; vertical-align:middle; }
  .real.y { background:#1d3a2c; color:#6FE3A5; } .real.n { background:#3a2e1d; color:var(--amber); }
  canvas { width:100%; height:300px; display:block; }
  .rec { color:var(--amber); font-size:12px; margin-left:6px; }
  @media (max-width:640px){ .grid{grid-template-columns:1fr} main{padding:16px} canvas{height:240px} }
</style></head><body>

</div>

function animate(cv, P, labels){

  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const pad={l:12,r:12,t:14,b:26}; const X=x=>pad.l+x*(W-pad.l-pad.r), Y=y=>H-pad.b-y*(H-pad.t-pad.b);
  const ease=t=>t>=1?1:1-Math.pow(2,-10*t); // expo.out — 사이트 이징과 같음
  const t0=performance.now();
  (function frame(now){
    const t=(now-t0)/1400; const e=ease(Math.min(1,t)); const dropT=Math.max(0,(now-t0-1900)/900);
    g.clearRect(0,0,W,H);

      g.globalAlpha = p.drop ? 1-Math.min(1,dropT)*.9 : 1; g.fillStyle=p.c; g.beginPath(); g.arc(X(x),Y(y),p.r,0,7); g.fill(); }
    g.globalAlpha=Math.max(0,(t-.6)/.4); g.fillStyle=MUTED; g.font='12px ui-monospace,Menlo,monospace';
    for(const [txt,x,y] of labels) g.fillText(txt, X(x), Y(y));
    g.globalAlpha=1;
    if (t<1 || (dropT<1 && P.some(p=>p.drop))) requestAnimationFrame(frame);
  })(t0);
}
const all = () => runs.forEach(r => r());
document.getElementById('replay').onclick = all;
requestAnimationFrame(all);
</script>
